version: '3.8'

# NOTE: PostgreSQL is hosted on Supabase — no local `postgres` container.
# Set DATABASE_URL / DIRECT_URL / SUPABASE_* in backend/.env from your
# Supabase project (Dashboard > Project Settings > Database + API keys).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avenqra_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: development
      AI_SERVICE_URL: http://ai-service:8000

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: avenqra_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENV: development

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: avenqra_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
